plugins:
  remote_user_info_enabled:
    default: false
    client: true

  remote_user_info_card_url:
    default: ""

  remote_user_info_summary_url:
    default: ""

  remote_user_info_show_on_user_card:
    default: true
    client: true

  remote_user_info_show_on_user_summary:
    default: true
    client: true

  remote_user_info_cache_minutes:
    default: 10
    min: 1
    max: 1440

  remote_user_info_timeout_ms:
    default: 2000
    min: 250
    max: 10000
